name: Build APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "tg-ws-proxy-android-source.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify uploaded source archive
        run: test -f tg-ws-proxy-android-source.zip

      - name: Extract and overlay Android project
        run: |
          mkdir -p /tmp/tg-ws-proxy-source
          unzip -q tg-ws-proxy-android-source.zip -d /tmp/tg-ws-proxy-source
          rsync -a --exclude='.github/' /tmp/tg-ws-proxy-source/tg-ws-proxy-android-app/ ./

      - name: Embed existing proxy core
        run: |
          test -f proxy/tg_ws_proxy.py
          mkdir -p app/src/main/python/proxy
          cp proxy/tg_ws_proxy.py app/src/main/python/proxy/tg_ws_proxy.py
          touch app/src/main/python/proxy/__init__.py
          python3 tools/patch_android_core.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
