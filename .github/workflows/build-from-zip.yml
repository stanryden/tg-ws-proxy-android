name: Build TG WS Proxy APK

on:
  workflow_dispatch:
  push:
    paths:
      - "tg-ws-proxy-android-source.zip"
      - "tg-ws-proxy-android-source-replacement.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select source archive
        id: archive
        shell: bash
        run: |
          if [ -f "tg-ws-proxy-android-source-replacement.zip" ]; then
            echo "file=tg-ws-proxy-android-source-replacement.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "tg-ws-proxy-android-source.zip" ]; then
            echo "file=tg-ws-proxy-android-source.zip" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Source ZIP archive was not found."
            exit 1
          fi

      - name: Extract Android project
        env:
          ARCHIVE: ${{ steps.archive.outputs.file }}
        run: |
          mkdir -p /tmp/tg-ws-proxy-source
          unzip -q "$ARCHIVE" -d /tmp/tg-ws-proxy-source
          test -d /tmp/tg-ws-proxy-source/tg-ws-proxy-android-app
          rsync -a --exclude='.github/' /tmp/tg-ws-proxy-source/tg-ws-proxy-android-app/ ./

      - name: Embed proxy core
        run: |
          test -f proxy/tg_ws_proxy.py
          test -f tools/patch_android_core.py
          mkdir -p app/src/main/python/proxy
          cp proxy/tg_ws_proxy.py app/src/main/python/proxy/tg_ws_proxy.py
          touch app/src/main/python/proxy/__init__.py
          python3 tools/patch_android_core.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
